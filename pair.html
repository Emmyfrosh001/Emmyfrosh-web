<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMMYFROSH-AI SESSION</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      :root {
        /* ── Dark neon theme ──
           Swapped the light-blue palette for a near-black background with
           glowing cyan/blue/purple accents, matching the reference
           screenshot. Text overlays flipped back to light-on-dark
           (rgba(255,255,255,X)) since the background is dark again. */
        --primary-color: #0a0e17;
        --secondary-color: #0f1420;
        --accent-color: #22d3ee;
        --text-color: #e6f7ff;
        --background-color: #05070c;
        --hover-color: #131a2a;
        --border-color: rgba(34, 211, 238, 0.15);
        --gradient-primary: linear-gradient(135deg, #22d3ee 0%, #3b82f6 50%, #a855f7 100%);
        --gradient-secondary: linear-gradient(135deg, #34d399 0%, #22d3ee 100%);
        --success-color: #4ade80;
        --card-bg: rgba(15, 20, 32, 0.75);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif;
        background: radial-gradient(ellipse at top, #0d1524 0%, #05070c 60%, #020304 100%);
        color: var(--text-color);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 15px;
        backdrop-filter: blur(20px);
        position: relative;
        overflow-x: hidden;
      }

      /* Falling-snow canvas — sits behind the container, fixed to the
         viewport so it keeps drifting regardless of scroll. */
      #snowCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 0;
        pointer-events: none;
      }

      .container {
        width: 100%;
        max-width: 450px;
        background: var(--card-bg);
        border-radius: 24px;
        padding: 30px;
        box-shadow: 
          0 20px 60px rgba(34, 211, 238, 0.12),
          0 0 0 1px rgba(34, 211, 238, 0.15),
          inset 0 1px 0 rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(34, 211, 238, 0.18);
        position: relative;
        overflow: hidden;
        z-index: 1;
      }

      .container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(34, 211, 238, 0.6), transparent);
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
        position: relative;
      }

      .logo {
        width: 90px;
        height: 90px;
        margin: 0 auto 20px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        box-shadow: 
          0 10px 30px rgba(34, 211, 238, 0.45),
          0 0 0 1px rgba(255, 255, 255, 0.1);
        position: relative;
        transform: perspective(1000px) rotateY(0deg);
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .logo:hover {
        transform: perspective(1000px) rotateY(10deg) scale(1.05);
        box-shadow: 
          0 15px 40px rgba(34, 211, 238, 0.6),
          0 0 0 1px rgba(255, 255, 255, 0.2);
      }

      .logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        position: relative;
        z-index: 2;
      }

      .title {
        font-size: 26px;
        font-weight: 800;
        margin-bottom: 8px;
        background: var(--gradient-primary);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        letter-spacing: -0.5px;
        text-shadow: 0 0 30px rgba(34, 211, 238, 0.3);
      }

      .subtitle {
        font-size: 14px;
        color: rgba(230, 247, 255, 0.6);
        margin-bottom: 25px;
        font-weight: 400;
        letter-spacing: 0.3px;
      }

      .social-icons {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 25px;
      }

      .social-icons a {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 18px;
        text-decoration: none;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        background: rgba(34, 211, 238, 0.06);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(34, 211, 238, 0.15);
        position: relative;
        overflow: hidden;
      }

      .social-icons a::before {
        content: '';
        position: absolute;
        inset: 0;
        background: currentColor;
        opacity: 0.1;
        transition: opacity 0.3s ease;
      }

      .social-icons a.youtube {
        color: #ff0000;
      }
      .social-icons a.telegram {
        color: #0088cc;
      }
      .social-icons a.whatsapp {
        color: #25D366;
      }
      .social-icons a.github {
        color: #ffffff;
      }

      .social-icons a:hover {
        transform: translateY(-3px) scale(1.05);
        box-shadow: 0 10px 25px rgba(34, 211, 238, 0.25);
        border-color: rgba(34, 211, 238, 0.4);
      }

      .social-icons a:hover::before {
        opacity: 0.18;
      }

      /* GitHub fork/star badges */
      .repo-badges {
        display: flex;
        justify-content: center;
        gap: 14px;
        margin-top: 14px;
        margin-bottom: 10px;
      }

      .repo-badge {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        border-radius: 14px;
        background: rgba(34, 211, 238, 0.06);
        border: 1px solid rgba(34, 211, 238, 0.18);
        color: rgba(230, 247, 255, 0.85);
        text-decoration: none;
        font-size: 15px;
        font-weight: 700;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        backdrop-filter: blur(10px);
      }

      /* Icons bumped up a bit bigger than the surrounding text so the
         fork/star symbols are easy to spot at a glance. */
      .repo-badge i {
        font-size: 20px;
      }

      .fork-badge i {
        color: #60a5fa;
      }

      .star-badge i {
        color: #facc15;
      }

      .repo-badge:hover {
        transform: translateY(-2px);
        background: rgba(34, 211, 238, 0.12);
        border-color: rgba(34, 211, 238, 0.35);
        box-shadow: 0 8px 20px rgba(34, 211, 238, 0.2);
      }

      /* Toggle Switch Styles */
      .toggle-container {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 25px;
        background: rgba(34, 211, 238, 0.04);
        border-radius: 16px;
        padding: 4px;
        border: 1px solid rgba(34, 211, 238, 0.12);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
        position: relative;
      }

      .toggle-option {
        flex: 1;
        padding: 14px 20px;
        text-align: center;
        cursor: pointer;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        z-index: 1;
        color: rgba(230, 247, 255, 0.5);
        backdrop-filter: blur(10px);
      }

      .toggle-option.active {
        background: var(--gradient-primary);
        color: white;
        box-shadow: 0 4px 15px rgba(34, 211, 238, 0.4);
      }

      .toggle-option:not(.active):hover {
        color: rgba(230, 247, 255, 0.85);
        background: rgba(34, 211, 238, 0.08);
      }

      .toggle-option i {
        margin-right: 8px;
      }

      .copy-btn {
        width: 100%;
        padding: 16px;
        background: rgba(34, 211, 238, 0.05);
        border: 1.5px solid rgba(34, 211, 238, 0.15);
        border-radius: 16px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: rgba(230, 247, 255, 0.8);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        backdrop-filter: blur(10px);
        margin-top: 20px;
      }

      .copy-btn:hover {
        background: rgba(34, 211, 238, 0.1);
        border-color: rgba(34, 211, 238, 0.3);
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(34, 211, 238, 0.2);
        color: #fff;
      }

      .input-group {
        margin-bottom: 25px;
        transition: all 0.3s ease;
      }

      .input-group.hidden {
        display: none;
      }

      .input-label {
        display: block;
        margin-bottom: 10px;
        font-weight: 600;
        font-size: 14px;
        color: rgba(230, 247, 255, 0.8);
        letter-spacing: 0.5px;
      }

      .input-field {
        width: 100%;
        padding: 16px 20px;
        border: 1.5px solid rgba(34, 211, 238, 0.15);
        border-radius: 16px;
        background: rgba(34, 211, 238, 0.04);
        color: var(--text-color);
        font-size: 15px;
        font-weight: 500;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        backdrop-filter: blur(10px);
      }

      .input-field::placeholder {
        color: rgba(230, 247, 255, 0.3);
      }

      .input-field:focus {
        outline: none;
        border-color: rgba(34, 211, 238, 0.6);
        box-shadow: 
          0 0 0 3px rgba(34, 211, 238, 0.15),
          0 4px 20px rgba(34, 211, 238, 0.1);
        background: rgba(34, 211, 238, 0.07);
      }

      .generate-btn {
        width: 100%;
        padding: 18px;
        background: var(--gradient-primary);
        border: none;
        border-radius: 16px;
        color: white;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        margin-bottom: 20px;
        letter-spacing: 0.5px;
        position: relative;
        overflow: hidden;
      }

      .generate-btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
        transition: 0.5s;
      }

      .generate-btn:hover {
        transform: translateY(-3px);
        box-shadow: 
          0 15px 40px rgba(34, 211, 238, 0.45),
          0 0 0 1px rgba(255, 255, 255, 0.1);
      }

      .generate-btn:hover::before {
        left: 100%;
      }

      .generate-btn.hidden {
        display: none;
      }

      .code-display {
        background: rgba(34, 211, 238, 0.04);
        padding: 20px;
        border-radius: 16px;
        text-align: center;
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 20px;
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1.5px solid rgba(34, 211, 238, 0.15);
        backdrop-filter: blur(10px);
        font-family: 'Courier New', monospace;
        letter-spacing: 2px;
        color: var(--success-color);
        box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
        text-shadow: 0 0 12px rgba(74, 222, 128, 0.4);
      }

      .qr-display {
        background: rgba(34, 211, 238, 0.04);
        padding: 30px;
        border-radius: 16px;
        text-align: center;
        margin-bottom: 20px;
        border: 1.5px solid rgba(34, 211, 238, 0.15);
        backdrop-filter: blur(10px);
        display: none;
        position: relative;
        overflow: hidden;
      }

      .qr-display::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--gradient-primary);
        opacity: 0.06;
        z-index: 0;
      }

      .qr-image {
        max-width: 280px;
        max-height: 280px;
        margin: 0 auto 20px;
        border-radius: 16px;
        box-shadow: 
          0 15px 35px rgba(34, 211, 238, 0.25),
          0 0 0 1px rgba(34, 211, 238, 0.15);
        position: relative;
        z-index: 1;
        background: white;
        padding: 15px;
      }

      .qr-instructions {
        font-size: 14px;
        color: rgba(230, 247, 255, 0.7);
        line-height: 1.6;
        position: relative;
        z-index: 1;
      }

      .success-message {
        color: var(--success-color);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-size: 18px;
        text-shadow: 0 2px 14px rgba(74, 222, 128, 0.4);
      }

      .error-message {
        color: #f87171;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-size: 16px;
        text-shadow: 0 2px 10px rgba(248, 113, 113, 0.3);
      }

      .loading {
        display: none;
        text-align: center;
        margin: 20px 0;
      }

      .loading .spin-icon {
        color: var(--accent-color);
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .footer {
        text-align: center;
        margin-top: 25px;
        font-size: 12px;
        color: rgba(230, 247, 255, 0.4);
        padding-top: 20px;
        border-top: 1px solid rgba(34, 211, 238, 0.1);
        letter-spacing: 0.5px;
      }

      .footer p {
        opacity: 0.7;
        transition: opacity 0.3s ease;
      }

      .footer p:hover {
        opacity: 1;
      }

      @media (max-width: 480px) {
        .container {
          padding: 25px;
          border-radius: 20px;
          max-width: 400px;
        }

        .code-display {
          font-size: 17px;
          min-height: 55px;
          padding: 18px;
        }

        .qr-image {
          max-width: 240px;
          max-height: 240px;
        }

        .qr-display {
          padding: 25px;
        }

        .logo {
          width: 78px;
          height: 78px;
          border-radius: 18px;
        }

        .title {
          font-size: 22px;
        }
      }

      /* ── Hamburger menu ── */
      .menu-toggle {
        position: fixed;
        top: 22px;
        right: 22px;
        z-index: 20;
        width: 46px;
        height: 46px;
        border-radius: 14px;
        background: rgba(34, 211, 238, 0.08);
        border: 1px solid rgba(34, 211, 238, 0.2);
        backdrop-filter: blur(10px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .menu-toggle:hover {
        background: rgba(34, 211, 238, 0.15);
        border-color: rgba(34, 211, 238, 0.4);
        box-shadow: 0 6px 18px rgba(34, 211, 238, 0.25);
      }

      .menu-toggle span {
        display: block;
        width: 20px;
        height: 2px;
        border-radius: 2px;
        background: var(--text-color);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .menu-toggle.open span:nth-child(1) {
        transform: translateY(7px) rotate(45deg);
      }
      .menu-toggle.open span:nth-child(2) {
        opacity: 0;
      }
      .menu-toggle.open span:nth-child(3) {
        transform: translateY(-7px) rotate(-45deg);
      }

      .menu-overlay {
        position: fixed;
        inset: 0;
        background: rgba(2, 3, 4, 0.55);
        backdrop-filter: blur(3px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
        z-index: 15;
      }

      .menu-overlay.open {
        opacity: 1;
        pointer-events: auto;
      }

      .side-menu {
        position: fixed;
        top: 0;
        right: 0;
        height: 100%;
        width: 260px;
        max-width: 80vw;
        background: rgba(9, 13, 22, 0.97);
        border-left: 1px solid rgba(34, 211, 238, 0.18);
        box-shadow: -20px 0 60px rgba(0, 0, 0, 0.5);
        transform: translateX(100%);
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 16;
        padding: 90px 20px 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .side-menu.open {
        transform: translateX(0);
      }

      .side-menu button {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        border-radius: 14px;
        color: rgba(230, 247, 255, 0.85);
        text-decoration: none;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        background: rgba(34, 211, 238, 0.04);
        border: 1px solid rgba(34, 211, 238, 0.1);
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .side-menu button svg {
        width: 20px;
        flex-shrink: 0;
        color: var(--accent-color);
      }

      .side-menu button:hover {
        background: rgba(34, 211, 238, 0.12);
        border-color: rgba(34, 211, 238, 0.35);
        transform: translateX(-3px);
      }

      /* ── Home feature grid (Session / Deploy / Repo) ── */
      .feature-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-bottom: 25px;
      }

      .feature-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 8px;
        padding: 22px 14px;
        border-radius: 16px;
        background: rgba(34, 211, 238, 0.04);
        border: 1.5px solid rgba(34, 211, 238, 0.15);
        backdrop-filter: blur(10px);
        cursor: pointer;
        text-decoration: none;
        color: inherit;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .feature-card:hover {
        background: rgba(34, 211, 238, 0.1);
        border-color: rgba(34, 211, 238, 0.35);
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(34, 211, 238, 0.18);
      }

      .feature-card.full-width {
        grid-column: 1 / -1;
      }

      .feature-card i {
        font-size: 26px;
      }

      .feature-card .fa-key,
      .feature-card .fa-solid.fa-key {
        color: #a855f7;
      }
      .feature-card .fa-rocket {
        color: #34d399;
      }
      .feature-card .fa-github {
        color: #e6f7ff;
      }

      .feature-card h3 {
        font-size: 15px;
        font-weight: 700;
        color: var(--text-color);
      }

      .feature-card p {
        font-size: 12px;
        color: rgba(230, 247, 255, 0.55);
      }

      #pairingSection {
        display: none;
      }

      #pairingSection.visible {
        display: block;
        animation: fadeSlideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      #homeView.hidden {
        display: none;
      }

      .back-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(34, 211, 238, 0.06);
        border: 1px solid rgba(34, 211, 238, 0.18);
        color: rgba(230, 247, 255, 0.8);
        font-size: 14px;
        font-weight: 600;
        padding: 10px 16px;
        border-radius: 12px;
        cursor: pointer;
        margin-bottom: 20px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .back-btn:hover {
        background: rgba(34, 211, 238, 0.12);
        border-color: rgba(34, 211, 238, 0.35);
        color: #fff;
      }

      @keyframes fadeSlideIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Subtle glow effect for container */
      .container {
        position: relative;
      }

      .container::after {
        content: '';
        position: absolute;
        top: -1px;
        left: -1px;
        right: -1px;
        bottom: -1px;
        background: var(--gradient-primary);
        border-radius: 25px;
        z-index: -1;
        opacity: 0.18;
        filter: blur(18px);
      }
    </style>
  </head>
  <body>
    <canvas id="snowCanvas"></canvas>

    <div class="menu-toggle" id="menuToggle" aria-label="Open menu">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="menu-overlay" id="menuOverlay"></div>
    <nav class="side-menu" id="sideMenu">
      <button type="button" id="menuHome"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></svg> Home</button>
      <button type="button" id="menuFeatures"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg> Features</button>
      <button type="button" id="menuDeploy"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2c3 2 5 6 5 10 0 1.5-.3 3-.9 4.4l-1.8-1.2c.4-1 .7-2.1.7-3.2 0-3-1.4-6-3-7.6-1.6 1.6-3 4.6-3 7.6 0 1.1.3 2.2.7 3.2L7.9 16.4C7.3 15 7 13.5 7 12c0-4 2-8 5-10zm0 7a2 2 0 110 4 2 2 0 010-4zM6.5 16.5c-1.5 1-2.3 2.7-2.5 4.5 1.8-.2 3.5-1 4.5-2.5l-2-2zm11 0l-2 2c1 1.5 2.7 2.3 4.5 2.5-.2-1.8-1-3.5-2.5-4.5z"/></svg> How to Deploy</button>
    </nav>

    <div class="container">

          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm10 0h2v2h-2v-2zm4 0h2v2h-2v-2zm-4 4h2v2h-2v-2zm4 0h2v2h-2v-2zm-2-8h2v2h-2V9z"/></svg> QR Code
        </div>
      </div>

      <div class="input-group" id="inputGroup">
        <label class="input-label"
          >Enter your WhatsApp number with country code</label
        >
        <input
          type="text"
          id="mobileNumber"
          class="input-field"
          placeholder="+923237045919"
          pattern="[+][0-9]{10,}"
          title="Please enter country code starting with + followed by number"
        />
      </div>

      <button class="generate-btn" id="submit">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M14 2a6 6 0 00-5.87 7.32L2 15.45V19h3.55l1.13-1.13H9v-2h2v-2h1.68l.61-.61A6 6 0 1014 2zm1.5 3a1.5 1.5 0 110 3 1.5 1.5 0 010-3z"/></svg> Generate Pair Code
      </button>

      <div class="loading" id="loading">
        <svg class="spin-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="9" stroke-opacity="0.25"/><path d="M21 12a9 9 0 00-9-9"/></svg>
      </div>

      <div class="code-display" id="codeDisplay">
        Your pair code will appear here
      </div>

      <div class="qr-display" id="qrDisplay">
        <img id="qrImage" class="qr-image" src="" alt="QR Code" />
        <div class="qr-instructions" id="qrInstructions">
          Scan this QR code with your WhatsApp app
        </div>
      </div>

      <button class="copy-btn" id="copy" onclick="copyCode()">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M16 1H4a2 2 0 00-2 2v14h2V3h12V1zm3 4H8a2 2 0 00-2 2v14a2 2 0 002 2h11a2 2 0 002-2V7a2 2 0 00-2-2zm0 16H8V7h11v14z"/></svg> Copy Code
      </button>
      </section>

      <div class="footer">
        <p>© 2026 EMMYFROSH-AI. All rights reserved.</p>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
    <script>
      // ── Falling snow background ──
      // Lightweight canvas particle loop: a fixed set of circles drift
      // downward with a slight side-to-side sway, wrapping back to the
      // top (or opposite edge) once they leave the viewport, so it loops
      // forever without ever needing to add/remove elements.
      (function initSnow() {
        const canvas = document.getElementById("snowCanvas");
        const ctx = canvas.getContext("2d");

        function resize() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener("resize", resize);

        const FLAKE_COUNT = 90;
        const flakes = Array.from({ length: FLAKE_COUNT }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 2.5 + 1,
          fallSpeed: Math.random() * 1 + 0.4,
          drift: Math.random() * 0.6 - 0.3,
          swayPhase: Math.random() * Math.PI * 2,
          swaySpeed: Math.random() * 0.02 + 0.01,
        }));

        function tick() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          // Soft cyan-tinted flakes so they read against the dark neon bg
          // instead of stark white.
          ctx.fillStyle = "rgba(180, 230, 255, 0.7)";

          for (const f of flakes) {
            f.swayPhase += f.swaySpeed;
            f.x += f.drift + Math.sin(f.swayPhase) * 0.3;
            f.y += f.fallSpeed;

            if (f.y > canvas.height + 5) {
              f.y = -5;
              f.x = Math.random() * canvas.width;
            }
            if (f.x > canvas.width + 5) f.x = -5;
            if (f.x < -5) f.x = canvas.width + 5;

            ctx.beginPath();
            ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
            ctx.fill();
          }

          requestAnimationFrame(tick);
        }

        requestAnimationFrame(tick);
      })();

      // ── GitHub repo fork/star counts ──
      // Pulled live from the public GitHub API. No auth needed for public
      // repos, but GitHub's unauthenticated rate limit is 60 req/hour per
      // IP — fine for a page people load occasionally, but if this page
      // gets heavy traffic consider caching the counts server-side instead
      // of calling the API from every visitor's browser.
      (async function loadRepoStats() {
        const forkEl = document.getElementById("forkCount");
        const starEl = document.getElementById("starCount");
        try {
          const res = await fetch(
            "https://api.github.com/repos/Emmyfrosh001/EmmyFrosh-Ai",
          );
          if (!res.ok) throw new Error("GitHub API error " + res.status);
          const data = await res.json();
          forkEl.textContent = data.forks_count ?? "0";
          starEl.textContent = data.stargazers_count ?? "0";
        } catch (e) {
          console.error("Failed to load repo stats:", e);
          forkEl.textContent = "-";
          starEl.textContent = "-";
        }
      })();

      // ── Home feature cards ──
      function showPairing() {
        document.getElementById("homeView").classList.add("hidden");
        document.getElementById("pairingSection").classList.add("visible");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function showHome() {
        document.getElementById("pairingSection").classList.remove("visible");
        document.getElementById("homeView").classList.remove("hidden");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      document.getElementById("sessionCard").addEventListener("click", showPairing);
      document.getElementById("backHome").addEventListener("click", showHome);

      document.getElementById("deployCard").addEventListener("click", () => {
        alert(
          "How to deploy:\n\n1. Fork the repo on GitHub\n2. Clone it to your server or host (Heroku, Render, VPS, etc.)\n3. Run npm install\n4. Set your environment variables\n5. Start the bot with npm start\n\nFull guide is in the GitHub README.",
        );
      });

      // ── Hamburger menu ──
      (function initMenu() {
        const toggle = document.getElementById("menuToggle");
        const overlay = document.getElementById("menuOverlay");
        const menu = document.getElementById("sideMenu");

        function openMenu() {
          toggle.classList.add("open");
          overlay.classList.add("open");
          menu.classList.add("open");
        }

        function closeMenu() {
          toggle.classList.remove("open");
          overlay.classList.remove("open");
          menu.classList.remove("open");
        }

        toggle.addEventListener("click", () => {
          if (menu.classList.contains("open")) closeMenu();
          else openMenu();
        });

        overlay.addEventListener("click", closeMenu);

        document.getElementById("menuHome").addEventListener("click", (e) => {
          e.preventDefault();
          closeMenu();
          showHome();
        });

        document.getElementById("menuFeatures").addEventListener("click", (e) => {
          e.preventDefault();
          closeMenu();
          alert(
            "Features:\n\n• Pair Code linking\n• QR Code linking\n• Fast, lightweight session setup\n• Live GitHub fork/star stats\n• Free & open source",
          );
        });

        document.getElementById("menuDeploy").addEventListener("click", (e) => {
          e.preventDefault();
          closeMenu();
          document.getElementById("deployCard").click();
        });
      })();

      let currentMode = "pair";

      // Toggle functionality
      document.querySelectorAll(".toggle-option").forEach((option) => {
        option.addEventListener("click", function () {
          const mode = this.dataset.mode;
          if (mode === currentMode) return;

          // Update active state
          document
            .querySelectorAll(".toggle-option")
            .forEach((opt) => opt.classList.remove("active"));
          this.classList.add("active");

          // Update mode
          currentMode = mode;

          // Update button and input visibility
          const submitBtn = document.getElementById("submit");
          const inputGroup = document.getElementById("inputGroup");

          if (mode === "pair") {
            submitBtn.innerHTML =
              '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M14 2a6 6 0 00-5.87 7.32L2 15.45V19h3.55l1.13-1.13H9v-2h2v-2h1.68l.61-.61A6 6 0 1014 2zm1.5 3a1.5 1.5 0 110 3 1.5 1.5 0 010-3z"/></svg> Generate Pair Code';
            submitBtn.classList.remove("hidden");
            inputGroup.classList.remove("hidden");
          } else {
            submitBtn.classList.add("hidden");
            inputGroup.classList.add("hidden");
            // Auto-generate QR code when QR mode is selected
            generateQRCode();
          }

          // Clear displays
          document.getElementById("codeDisplay").innerHTML =
            "Your pair code will appear here";
          document.getElementById("qrDisplay").style.display = "none";
          document.getElementById("codeDisplay").style.display = "flex";
        });
      });

      async function generateQRCode() {
        const codeDisplay = document.getElementById("codeDisplay");
        const qrDisplay = document.getElementById("qrDisplay");
        const loadingSpinner = document.getElementById("loading");

        loadingSpinner.style.display = "block";
        codeDisplay.innerHTML = "";
        qrDisplay.style.display = "none";

        try {
          const response = await axios("/qr");

          if (response.data.qr) {
            document.getElementById("qrImage").src = response.data.qr;
            document.getElementById("qrInstructions").innerHTML =
              response.data.instructions.join("<br>");
            qrDisplay.style.display = "block";
            codeDisplay.style.display = "none";
          } else {
            codeDisplay.innerHTML =
              '<div class="error-message"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg> Failed to generate QR code</div>';
            codeDisplay.style.display = "flex";
          }
        } catch (error) {
          console.error("Error generating QR code:", error);
          codeDisplay.innerHTML =
            '<div class="error-message"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg> Error generating QR code. Please try again.</div>';
          codeDisplay.style.display = "flex";
        } finally {
          loadingSpinner.style.display = "none";
        }
      }

      document.getElementById("submit").addEventListener("click", async (e) => {
        e.preventDefault();

        const mobileNumberInput = document.getElementById("mobileNumber");
        const codeDisplay = document.getElementById("codeDisplay");
        const qrDisplay = document.getElementById("qrDisplay");
        const loadingSpinner = document.getElementById("loading");

        const mobileNumber = mobileNumberInput.value.trim();
        if (!mobileNumber) {
          codeDisplay.innerHTML =
            '<div class="error-message"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg> Please enter your WhatsApp number</div>';
          return;
        }

        loadingSpinner.style.display = "block";
        codeDisplay.innerHTML = "";
        qrDisplay.style.display = "none";

        try {
          const response = await axios(
            `/pair?number=${mobileNumber.replace(/[^0-9]/g, "")}`,
          );

          const code = response.data.code || "Service Unavailable";
          if (code === "Service Unavailable") {
            codeDisplay.innerHTML =
              '<div class="error-message"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg> Service Unavailable</div>';
          } else {
            codeDisplay.innerHTML = `<div class="success-message"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm-1.5 14.5L6 12l1.4-1.4 3.1 3.1 6.1-6.1L18 9z"/></svg> CODE: ${code}</div>`;
          }
          codeDisplay.style.display = "flex";
        } catch (error) {
          console.error("Error generating code:", error);
          codeDisplay.innerHTML =
            '<div class="error-message"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg> Error generating code. Please try again.</div>';
          codeDisplay.style.display = "flex";
        } finally {
          loadingSpinner.style.display = "none";
        }
      });
      function copyCode() {
        const codeDisplay = document.getElementById("codeDisplay").innerText;
        const code = codeDisplay.replace("CODE: ", "");
        navigator.clipboard
          .writeText(code)
          .then(() => {
            const copyBtn = document.getElementById("copy");
            const originalText = copyBtn.innerHTML;
            copyBtn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg> Copied!';
            setTimeout(() => {
              copyBtn.innerHTML = originalText;
            }, 2000);
          })
          .catch((err) => {
            console.error("Failed to copy text: ", err);
          });
      }
    </script>
  </body>
</html>
